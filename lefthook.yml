pre-commit:
  jobs:
    # CI and cloud agents don't have the shared command.
    - name: worktree
      run: '[ ! -x "$HOME/bin/agent-t3-worktree" ] || "$HOME/bin/agent-t3-worktree" check --heal'
    - group:
        parallel: true
        jobs:
          - name: oxlint
            glob: '*.{js,ts,jsx,tsx}'
            run: bunx oxlint --disable-nested-config --no-error-on-unmatched-pattern --fix {staged_files}
            stage_fixed: true
          - name: oxfmt
            run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: typecheck
            run: bun check
